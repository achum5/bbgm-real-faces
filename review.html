<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Review - BBGM Real Cartoon Faces</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="review-page">
<nav class="navbar navbar-border">
	<div class="container">
		<a class="navbar-brand fw-bold" href="./">BBGM Real Cartoon Faces</a>
		<a href="#" id="settings-toggle">Settings</a>
	</div>
</nav>

<div class="container my-3">
	<form id="settings" class="settings mb-3" hidden>
		<label class="form-label" for="csv">Responses sheet (published CSV link)</label>
		<input class="form-control form-control-sm mb-2" id="csv" autocomplete="off" spellcheck="false">
		<label class="form-label" for="token">GitHub token</label>
		<input class="form-control form-control-sm mb-2" id="token" type="password" autocomplete="off" spellcheck="false">
		<button class="btn btn-primary btn-sm">Save</button>
	</form>

	<div class="d-flex align-items-baseline gap-3 mb-2">
		<h2 class="mb-0" id="title">Suggestions</h2>
		<label class="form-check-label"><input class="form-check-input me-1" type="checkbox" id="show-reviewed">Show reviewed</label>
	</div>
	<div id="status" class="text-body-secondary mb-2"></div>
	<div id="list"></div>
</div>

<div class="publish-bar" id="publish-bar" hidden>
	<div class="container d-flex align-items-center gap-2">
		<button class="btn btn-primary" id="publish">Publish</button>
		<span id="publish-status"></span>
	</div>
</div>

<div id="edit-box" class="editor mt-2" hidden>
	<div class="edit-actions d-flex gap-2">
		<button type="button" class="btn btn-primary btn-sm" id="edit-accept">Accept edit</button>
		<button type="button" class="btn btn-light border btn-sm" id="edit-cancel">Cancel</button>
	</div>
	<div class="parts" id="parts"></div>
	<div id="part"></div>
</div>

<script type="module" src="review.js"></script>
</body>
</html>

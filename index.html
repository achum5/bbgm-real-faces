<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BBGM Real Faces</title>
<script>
if (matchMedia("(prefers-color-scheme: dark)").matches) {
	document.documentElement.dataset.bsTheme = "dark";
}
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-border">
	<div class="container">
		<a class="navbar-brand fw-bold" href="./">BBGM Real Faces</a>
		<a href="https://play.basketball-gm.com/">Play BBGM</a>
	</div>
</nav>

<div class="ticker" id="ticker"><div class="ticker-track" id="ticker-track"></div></div>

<div class="container my-3">
	<div class="row g-4">
		<div class="col-lg-5">
			<h2>Add to your league</h2>
			<div class="d-flex align-items-center gap-2 mb-2">
				<button class="btn btn-primary text-nowrap" id="copy">Copy faces</button>
				<span>&rarr; With God Mode on, paste in the Worker Console on your league's Danger Zone page at <a href="https://play.basketball-gm.com/">BBGM</a></span>
			</div>
			<details class="mb-3 more">
				<summary>More options</summary>
				<div class="form-check mt-1">
					<input class="form-check-input" type="checkbox" id="teams">
					<label class="form-check-label" for="teams">Also use real team names and logos, from <a href="https://www.reddit.com/r/BasketballGM/s/Pc0lHWNXlE">u/alexnoob</a></label>
				</div>
				<div class="form-check">
					<input class="form-check-input" type="checkbox" id="god-off">
					<label class="form-check-label" for="god-off">Turn God Mode off when done</label>
				</div>
				<div class="form-check ms-4">
					<input class="form-check-input" type="checkbox" id="achievements">
					<label class="form-check-label" for="achievements">Also allow achievements again</label>
				</div>
			</details>

			<h2>Downloads</h2>
			<ul>
				<li><a href="real-faces-2027-preseason.json.gz">League file, 2027 preseason</a></li>
				<li><a href="players.json">players.json</a></li>
			</ul>
		</div>

		<div class="col-lg-7">
			<div class="d-flex align-items-center gap-2 mb-2">
				<div class="picker">
					<input type="text" class="name" id="name" autocomplete="off" spellcheck="false" placeholder="Search players" title="Search players" aria-label="Player">
					<div class="matches list-group" id="matches" hidden></div>
				</div>
				<button class="btn btn-sm btn-light border" id="random">Random</button>
			</div>
			<div class="viewer">
				<img id="viewer-photo" alt="" referrerpolicy="no-referrer">
				<div class="face" id="viewer-face"></div>
				<span class="arrow" id="viewer-arrow" hidden>&rarr;</span>
				<div class="face" id="viewer-new" hidden></div>
			</div>
			<a href="#" class="d-inline-block mt-2" id="request-toggle" hidden>Request a change</a>
			<div id="request" class="mt-2" hidden>
				<ul class="nav nav-pills parts" id="parts"></ul>
				<div id="part" class="mt-2"></div>
				<textarea class="form-control form-control-sm mt-2" id="note" rows="2" placeholder="Optional note about the change"></textarea>
				<div class="d-flex align-items-center gap-2 mt-2">
					<button class="btn btn-primary btn-sm" id="send">Send</button>
					<button class="btn btn-light border btn-sm" id="reset">Reset</button>
					<span class="text-body-secondary" id="sent"></span>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>

name: Update league file

on:
  push:
    branches: [main]
    paths: [players.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  league:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/update-league.mjs
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name achum5
          git config user.email 45132830+achum5@users.noreply.github.com
          git commit -am "League file: faces from players.json"
          git push
